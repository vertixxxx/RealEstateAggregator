name: Run Periodic Real Estate Scraper

on:
  schedule:
    # Runs at minute 0 of every hour
    - cron: '0 * * * *'
  # Allows you to manually trigger the scraper anytime from the GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi sqlalchemy psycopg2-binary python-dotenv

      - name: Run Periodic Updater
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python updater.py